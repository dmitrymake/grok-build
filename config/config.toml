[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[cli]
installer = "internal"
auto_update = true

[ui]
max_thoughts_width = 120
fork_secondary_model = "gpt-5.6-luna"
yolo = false
compact_mode = false
theme = "auto"
permission_mode = "always-approve"
screen_mode = "fullscreen"

[privacy]
privacy_banner_acked = "2026-08-16T00:44:46Z"

[routing.verifiers]
"$REPO_ROOT" = [
    "./tests/grok-route-test.sh",
    "./tests/grok-combine-install-test.sh",
]

[models]
default = "glm-5.3-flash"
web_search = "grok-4.6"
default_reasoning_effort = "high"

[model."gemini-3.7-flash"]
model = "google/gemini-3.7-flash"
base_url = "https://api.commandcode.ai/provider/v1"
name = "Gemini 3.7 Flash (Command Code)"
description = "Command Code provider API. Conductor fallback and advisory second opinion. OpenAI chat completions."
api_backend = "chat_completions"
env_key = "COMMANDCODE_API_KEY"
context_window = 1048576

[memory]
enabled = true

[memory.initial_injection]
enabled = true

[visual_intake]
mode = "auto"
detail = "auto"
schema_version = 1
role_version = "1"

[subagents.models]
explore = "gpt-5.6-luna"
plan = "gpt-5.6-sol"
general-purpose = "gpt-5.6-luna"

[subagents.roles.visual-intake]
description = "Read-only visual intake: analyze images into structured context for the conductor. Does not route or implement."
model = "minimax-m3"
default_capability_mode = "read-only"
autonomy = "standard"
fallback = ["visual-intake-deep"]

[subagents.roles.visual-intake-deep]
description = "Read-only high-detail visual intake for comparisons, small diffs, dense diagrams, and low-confidence reinspection."
model = "gpt-5.6-terra"
default_capability_mode = "read-only"
autonomy = "standard"

[subagents.roles.explore]
description = "Read-only reconnaissance for scoped repository mapping."
model = "gpt-5.6-luna"
reasoning_effort = "high"
default_capability_mode = "read-only"
autonomy = "standard"

[subagents.roles.explore-thorough]
description = "Deep architecture-wide read-only reconnaissance."
model = "gpt-5.6-luna"
reasoning_effort = "max"
default_capability_mode = "read-only"
autonomy = "standard"

[subagents.roles.researcher]
description = "Deep multi-source research and synthesis lead."
model = "gpt-5.6-sol"
reasoning_effort = "max"
default_capability_mode = "read-only"
autonomy = "broad"

[subagents.roles.researcher-analyst]
description = "Alternative-perspective research analysis."
model = "glm-5.3"
reasoning_effort = "max"
default_capability_mode = "read-only"
autonomy = "broad"

[subagents.roles.researcher-challenger]
description = "Adversarial verification of research findings."
model = "grok-4.6"
default_capability_mode = "read-only"
autonomy = "standard"

# OLD routing layer: barrier composition arrives with the phase-H migration.

[subagents.roles.implement]
description = "Backward-compatible alias for the standard implementation role."
model = "gpt-5.6-luna"
reasoning_effort = "max"
default_capability_mode = "all"
autonomy = "guided"

[subagents.roles.implement-cheap]
description = "Low-scope, low-risk implementation."
model = "gpt-5.6-luna"
reasoning_effort = "high"
default_capability_mode = "all"
autonomy = "guided"

[subagents.roles.implement-standard]
description = "Standard implementation for everyday coding work."
model = "gpt-5.6-luna"
reasoning_effort = "max"
default_capability_mode = "all"
autonomy = "guided"

[subagents.roles.implement-strong]
description = "Strong implementation for medium-complexity work."
model = "gpt-5.6-sol"
reasoning_effort = "max"
default_capability_mode = "all"
autonomy = "standard"

[subagents.roles.implement-hard]
description = "Hard implementation for complex or high-risk work."
